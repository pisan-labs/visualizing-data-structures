# Netlify builds every push to main and every pull request (deploy preview).
# Tests run in GitHub Actions (.github/workflows/ci.yml), not here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Optional accounts (PLAN.md section 18): the shared HintWise Supabase project. Both values are
  # public by design (row-level security protects the data); the service-role key never goes here.
  # Remove these two lines to switch accounts off: the site then shows no sign-in at all.
  VITE_SUPABASE_URL = "https://auth.hintwise.org"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFya3R4bHJseWNlZmZ5b3pkd2hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODEwMTAsImV4cCI6MjA5MjQ1NzAxMH0.Vuku-irT3kAHZYibK23q6dpyOEqV_Eg5zB78I3dyshE"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker and the manifest are checked on every visit, so a deploy reaches readers
# who have the app installed (src/pwa/sw.js; the kill switch is scripts/sw-kill.js).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# No X-Frame-Options: pages must stay embeddable in Canvas and slides.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Unknown addresses get the app (which shows "Not here yet") with a real 404 status.
# Existing files, including every prerendered /<id>/index.html, always win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
